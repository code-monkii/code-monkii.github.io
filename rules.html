<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rules | Season 13 Champions OU</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pokemon.css">
    <link rel="stylesheet" href="css/type-chart.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

    <header id="site-header"></header>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main>

        <!-- =========================
             PAGE HERO
        ========================= -->

        <section class="schedule">

        <!-- =========================
             SEASON BANNER
        ========================== -->

        <section class="hero">

            <div class="hero-text">
                <p class="eyebrow">CHAMPIONS OU GUIDE</p>
                <h2>Bans & Rules</h2>
                <h3> Banned moves, items, abilities, and Pokémon for Season 13 Champions OU.</h3>
            </div>
            

            <div class="hero-badge">

                <div class="pokeball">
                    <div class="pokeball-line"></div>
                    <div class="pokeball-center"></div>
                </div>

            </div>
            


        </section>

                <section class="feature-grid anchor-grid" aria-label="Rules guide sections">
            <a href="#clauses" class="feature-card anchor-link pink">
                <div class="feature-icon"><img src="assets/images/quick-claw.png" alt="Clause Icon"></div>
                <h3>Clauses</h3>
            </a>

            <a href="#items" class="feature-card anchor-link mint">
                <div class="feature-icon"><img src="assets/images/seal-bag.png" alt="Item Icon"></div>
                <h3>Items</h3>
            </a>

            <a href="#abilities" class="feature-card anchor-link blue">
                <div class="feature-icon"><img src="assets/images/ability-capsule.png" alt="Ability Icon"></div>
                <h3>Abilities</h3>
            </a>

            <a href="#moves" class="feature-card anchor-link lavender">
                <div class="feature-icon"><img src="assets/images/tm.png" alt="Move Icon"></div>
                <h3>Moves</h3>
            </a>

            <a href="#pokemon" class="feature-card anchor-link lavender">
                <div class="feature-icon"><img src="assets/images/form-icon.png" alt="Pokémon Icon"></div>
                <h3>Pokémon</h3>
            </a>

            <a href="#megas" class="feature-card anchor-link lavender">
                <div class="feature-icon"><img src="assets/images/mega-icon-b.png" alt="Mega Icon"></div>
                <h3>Megas</h3>
            </a>
        </section>


        <!-- =========================
             CLAUSES
        ========================= -->

        <section class="rules-section">

            <div class="section-heading">
                <h2 id="clauses">CLAUSES</h2>
            </div>

            <div
                id="clauses-container"
                class="clauses-grid">
            </div>

        </section>


        <!-- =========================
             BANNED ITEMS
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2 id="items">BANNED ITEMS</h2>
            </div>

            <div
                id="banned-items-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED ABILITIES
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2 id="abilities">BANNED ABILITIES</h2>
            </div>

            <div
                id="banned-abilities-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED MOVES
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2 id="moves">BANNED MOVES</h2>
            </div>

            <div
                id="banned-moves-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED POKÉMON
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2 id="pokemon">BANNED POKÉMON</h2>
            </div>

            <div
                id="banned-pokemon-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED MEGAS
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2 id="megas">BANNED MEGAS</h2>
            </div>

            <div
                id="banned-mega-pokemon-container"
                class="banlist-grid">
            </div>

        </section>

    </main>


    <div id="site-footer"></div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="js/pokemon-api.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/partials.js"></script>

</body>

</html>
