<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rules | Season 13 Champions OU</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pokemon.css">
    <link rel="stylesheet" href="css/type-chart.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

    <header id="site-header"></header>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main>

        <!-- =========================
             PAGE HERO
        ========================= -->

        <section class="schedule">

        <!-- =========================
             SEASON BANNER
        ========================== -->

        <section class="hero">

            <div class="hero-text">

                <h2>Bans & Rules</h2>
                <h3> Banned moves, items, abilities, and Pokémon for Season 13 Champions OU.</h3>
            </div>
            

            <div class="hero-badge">

                <div class="pokeball">
                    <div class="pokeball-line"></div>
                    <div class="pokeball-center"></div>
                </div>

            </div>
            


        </section>


        <!-- =========================
             CLAUSES
        ========================= -->

        <section class="rules-section">

            <div class="section-heading">
                <h2>CLAUSES</h2>
            </div>

            <div
                id="clauses-container"
                class="clauses-grid">
            </div>

        </section>


        <!-- =========================
             BANNED ITEMS
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2>BANNED ITEMS</h2>
            </div>

            <div
                id="banned-items-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED ABILITIES
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2>BANNED ABILITIES</h2>
            </div>

            <div
                id="banned-abilities-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED MOVES
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2>BANNED MOVES</h2>
            </div>

            <div
                id="banned-moves-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED POKÉMON
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2>BANNED POKÉMON</h2>
            </div>

            <div
                id="banned-pokemon-container"
                class="banlist-grid">
            </div>

        </section>


        <!-- =========================
             BANNED MEGAS
        ========================= -->

        <section class="banlist-section">

            <div class="section-heading">
                <h2>BANNED MEGAS</h2>
            </div>

            <div
                id="banned-mega-pokemon-container"
                class="banlist-grid">
            </div>

        </section>

    </main>


    <div id="site-footer"></div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="js/pokemon-api.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/partials.js"></script>

</body>

</html>
